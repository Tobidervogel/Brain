<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="680" role="img">
<title>Verdrahtung Recorder: Akku, Ladeplatine, XIAO (Stand 09.10.2026)</title>
<desc>LiPo und USB-C gehen in die Adafruit-Ladeplatine bq24074. Von dort gehen LOAD plus und minus an die Akku-Lötflächen des XIAO, PGOOD an D3, CHG an D4 und der Akku-Pluspol über einen Spannungsteiler aus R1 und R2 an D0, mit einem Kondensator von D0 nach GND.</desc>
<style>
text{font-family:sans-serif;dominant-baseline:central}
.th{font-size:14px;font-weight:500;fill:#222}
.ts{font-size:12px;fill:#444}
.gray{fill:#F1EFE8;stroke:#5F5E5A}
.teal{fill:#E1F5EE;stroke:#0F6E56}
.purple{fill:#EEEDFE;stroke:#534AB7}
.box{fill:#fff;stroke:#888780}
</style>
<rect width="680" height="444" fill="#fff"/>
<rect class="gray" x="40" y="92" width="100" height="56" rx="4" stroke-width="0.5"/>
<text class="th" x="90" y="111" text-anchor="middle">LiPo</text>
<text class="ts" x="90" y="130" text-anchor="middle">3,7 V</text>
<rect class="gray" x="40" y="172" width="100" height="56" rx="4" stroke-width="0.5"/>
<text class="th" x="90" y="191" text-anchor="middle">USB-C</text>
<text class="ts" x="90" y="210" text-anchor="middle">5 V Netzteil</text>
<rect class="teal" x="190" y="40" width="160" height="320" rx="8" stroke-width="0.5"/>
<text class="th" x="270" y="62" text-anchor="middle">Adafruit bq24074</text>
<text class="ts" x="270" y="81" text-anchor="middle">Ladeplatine</text>
<text class="ts" x="198" y="120">Akku (JST)</text>
<text class="ts" x="198" y="200">USB-C</text>
<text class="ts" x="342" y="120" text-anchor="end">LOAD +</text>
<text class="ts" x="342" y="150" text-anchor="end">LOAD −</text>
<text class="ts" x="342" y="200" text-anchor="end">PGOOD</text>
<text class="ts" x="342" y="230" text-anchor="end">CHG</text>
<text class="ts" x="342" y="280" text-anchor="end">LIPO</text>
<rect class="purple" x="530" y="40" width="110" height="320" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="62" text-anchor="middle">XIAO</text>
<text class="ts" x="585" y="81" text-anchor="middle">ESP32S3 Sense</text>
<text class="ts" x="538" y="120">BAT +</text>
<text class="ts" x="538" y="150">BAT −</text>
<text class="ts" x="538" y="200">D3 (GPIO4)</text>
<text class="ts" x="538" y="230">D4 (GPIO5)</text>
<text class="ts" x="538" y="280">D0 (GPIO1)</text>
<text class="ts" x="538" y="340">GND</text>
<line x1="140" y1="114" x2="190" y2="114" stroke="#E24B4A" stroke-width="1.5"/>
<line x1="140" y1="126" x2="190" y2="126" stroke="#888780" stroke-width="1.5"/>
<path d="M140 200 L186 200 M180 196 L186 200 L180 204" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="350" y1="120" x2="530" y2="120" stroke="#E24B4A" stroke-width="1.5"/>
<line x1="350" y1="150" x2="530" y2="150" stroke="#888780" stroke-width="1.5"/>
<line x1="350" y1="200" x2="530" y2="200" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6 3"/>
<line x1="350" y1="230" x2="530" y2="230" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6 3"/>
<line x1="350" y1="280" x2="372" y2="280" stroke="#BA7517" stroke-width="1.5"/>
<line x1="424" y1="280" x2="530" y2="280" stroke="#BA7517" stroke-width="1.5"/>
<line x1="452" y1="280" x2="452" y2="298" stroke="#BA7517" stroke-width="1.5"/>
<line x1="502" y1="280" x2="502" y2="298" stroke="#BA7517" stroke-width="1.5"/>
<path d="M452 322 L452 340 L530 340" fill="none" stroke="#888780" stroke-width="1.5"/>
<line x1="502" y1="322" x2="502" y2="340" stroke="#888780" stroke-width="1.5"/>
<circle cx="452" cy="280" r="3" fill="#BA7517"/>
<circle cx="502" cy="280" r="3" fill="#BA7517"/>
<circle cx="502" cy="340" r="3" fill="#888780"/>
<rect class="box" x="372" y="268" width="52" height="24" rx="4" stroke-width="0.5"/>
<text class="ts" x="398" y="280" text-anchor="middle">R1</text>
<rect class="box" x="432" y="298" width="40" height="24" rx="4" stroke-width="0.5"/>
<text class="ts" x="452" y="310" text-anchor="middle">R2</text>
<rect class="box" x="486" y="298" width="32" height="24" rx="4" stroke-width="0.5"/>
<text class="ts" x="502" y="310" text-anchor="middle">C</text>
<line x1="40" y1="392" x2="64" y2="392" stroke="#E24B4A" stroke-width="1.5"/>
<text class="ts" x="70" y="392">Plus</text>
<line x1="120" y1="392" x2="144" y2="392" stroke="#888780" stroke-width="1.5"/>
<text class="ts" x="150" y="392">Minus</text>
<line x1="210" y1="392" x2="234" y2="392" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6 3"/>
<text class="ts" x="240" y="392">Meldeleitung</text>
<line x1="350" y1="392" x2="374" y2="392" stroke="#BA7517" stroke-width="1.5"/>
<text class="ts" x="380" y="392">Akkumessung</text>
<text class="ts" x="40" y="416">R1 = R2 = 470 kΩ (oder zwei gleiche ab 100 kΩ), C = 100 nF</text>
</svg>
